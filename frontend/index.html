<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <!--
    `viewport-fit=cover` is what makes env(safe-area-inset-*) resolve to
    anything but 0. Ten places in the app pad themselves with those insets --
    the bottom nav, the sheets, the order-accepted actions -- and without
    this every one of them was quietly padding by zero in the installed app.

    No maximum-scale and no user-scalable=no: pinch-zoom stays available.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#16A34A" />
  <meta name="description" content="Premium quality groceries delivered with care. Fresh from farm to your doorstep." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Timeless Baazar" />
  
  <!--
    Fonts.

    Preloaded, not merely declared: an @font-face in the stylesheet is not
    discovered until that stylesheet has been fetched and parsed, so the font
    request queues behind it. These two start immediately, in parallel with the
    CSS, which is most of what turns a visible flash of fallback text into no
    flash at all.

    Only the two faces every screen needs. The Latin Extended and Devanagari
    files are deliberately NOT preloaded -- their `unicode-range` lets the
    browser skip them entirely unless the page actually paints one of their
    characters, and preloading would throw that away.

    `crossorigin` is required even though these are same-origin: fonts are
    always fetched in CORS mode, and without it the preload is ignored and the
    file is downloaded a second time.
  -->
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/fonts/inter-rupee.woff2" as="font" type="font/woff2" crossorigin />

  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Icons -->
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  
  <title>Timeless Baazar - Fresh & Premium Groceries</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
