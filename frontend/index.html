<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <!--
    `viewport-fit=cover` is what makes env(safe-area-inset-*) resolve to
    anything but 0. Ten places in the app pad themselves with those insets --
    the bottom nav, the sheets, the order-accepted actions -- and without
    this every one of them was quietly padding by zero in the installed app.

    No maximum-scale and no user-scalable=no: pinch-zoom stays available.
  -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  
  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#16A34A" />
  <meta name="description" content="Premium quality groceries delivered with care. Fresh from farm to your doorstep." />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Timeless Baazar" />
  
  <!-- Manifest -->
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Icons -->
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  
  <title>Timeless Baazar - Fresh & Premium Groceries</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>
  <script type="module" src="/src/index.jsx"></script>
</body>

</html>
