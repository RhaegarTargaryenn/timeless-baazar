# Netlify configuration for Timeless Baazar PWA

[build]
  # The frontend lives in its own folder, so Netlify has to cd there before it
  # sees package.json. `publish` is resolved relative to `base`.
  base = "frontend"

  # Build command
  command = "npm run build"

  # Directory to deploy
  publish = "build"
  
  # Vite 7 requires ^20.19.0 || >=22.12.0. This said 18 until 2026-08-28 --
  # a leftover from before the Phase 0 move off Create React App, which would
  # have failed the build on an engine check.
  [build.environment]
    NODE_VERSION = "22"

# Redirect rules for React Router (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Hashed bundles, so they can be cached forever. Vite emits these into
# assets/; the path said static/ until 2026-08-28, which is where CRA put them
# -- the rule matched nothing and the real bundles went uncached.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Content-Type = "application/manifest+json"
