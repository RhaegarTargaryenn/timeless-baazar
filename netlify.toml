# Netlify configuration for Timeless Baazar PWA

[build]
  # The frontend lives in its own folder, so Netlify has to cd there before it
  # sees package.json. `publish` is resolved relative to `base`.
  base = "frontend"

  # Build command
  command = "npm run build"

  # Directory to deploy
  publish = "build"
  
  # Environment variables
  [build.environment]
    NODE_VERSION = "18"

# Redirect rules for React Router (SPA)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"
    Content-Type = "application/manifest+json"
